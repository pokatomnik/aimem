# Qdrant для aimem.
#
# Поднимает только векторную базу: приложение (`aimem`) запускается на хосте
# и подключается к ней по HTTP (REST, порт 6333) или gRPC (порт 6334).
#
#   cp .env.example .env      # опционально: переопределить порты/образ
#   docker compose up -d      # поднять
#   docker compose down       # остановить (данные остаются в volumes)
#   docker compose down -v    # остановить и удалить данные
#
# Переменные читаются из `.env` (Compose берёт его из этого каталога сам) или
# из окружения. Значения после `:-` — дефолты Qdrant, поэтому без `.env`
# сервис стартует ровно с настройками по умолчанию.

services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-v1.15.4}
    restart: unless-stopped

    # Публикуем только на loopback: у Qdrant по умолчанию нет аутентификации,
    # и выставлять его в сеть без ключа не стоит. Если база нужна из других
    # контейнеров или с другой машины — задайте QDRANT_HTTP_HOST/GRPC_HOST как
    # 0.0.0.0 и обязательно включите QDRANT_API_KEY (см. блок ниже).
    ports:
      - "${QDRANT_HTTP_HOST:-127.0.0.1}:${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST:-127.0.0.1}:${QDRANT_GRPC_PORT:-6334}:6334"

    # QDRANT__A__B — это вложенный ключ a.b из config.yaml.
    # Файла конфигурации здесь нет: всё задаётся переменными среды.
    environment:
      # Порты внутри контейнера. Менять не нужно — наружу они публикуются выше.
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334

      # Пути совпадают с дефолтами образа (WORKDIR = /qdrant), но прописаны
      # явно, чтобы было видно, к каким каталогам примонтированы volumes.
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/snapshots

      # true — payload и его индексы лежат на диске (дефолт Qdrant), false —
      # держать их в памяти. Для локальной памяти на тысячи фактов память
      # быстрее; для миллионов точек оставьте true.
      QDRANT__STORAGE__ON_DISK_PAYLOAD: ${QDRANT_ON_DISK_PAYLOAD:-true}

      # TRACE, DEBUG, INFO, WARN, ERROR.
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}

      # Дефолт Qdrant — false, то есть телеметрия отправляется. Включите,
      # чтобы её выключить.
      QDRANT__TELEMETRY_DISABLED: ${QDRANT_TELEMETRY_DISABLED:-false}

      # Аутентификация. НЕ РАСКОММЕНТИРУЙТЕ с пустым значением: Qdrant читает
      # api_key как Option<String>, а config-rs не отбрасывает пустые
      # переменные, поэтому пустая строка включает проверку ключа с пустым
      # паролем, и приложение перестаёт подключаться (healthz и /readyz при
      # этом остаются открытыми). Поэтому строки закомментированы, а не заданы
      # через `${QDRANT_API_KEY:-}`. Чтобы включить — задайте ключ в `.env`,
      # раскомментируйте две строки ниже и перезапустите compose.
      # QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
      # QDRANT__SERVICE__READ_ONLY_API_KEY: ${QDRANT_READ_ONLY_API_KEY:?set QDRANT_READ_ONLY_API_KEY in .env}

    volumes:
      # Именованные volumes: данные переживают `down`. `down -v` их удаляет.
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots

    # Healthcheck не задан осознанно: образ собран на debian-slim и не содержит
    # curl или wget, а проверка через bash /dev/tcp показывает только открытый
    # порт, но не готовность шардов. Проверяйте с хоста:
    #   curl http://127.0.0.1:6333/readyz   # all shards are ready
    #   curl http://127.0.0.1:6333/healthz  # healthz check passed

volumes:
  qdrant_storage:
  qdrant_snapshots:
